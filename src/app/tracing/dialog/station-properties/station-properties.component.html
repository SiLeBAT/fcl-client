<fcl-dialog-movable>
    <mat-dialog-content>
        <mat-card appearance="outlined">
            <mat-card-title>
                <span>{{ data.station.name }}</span>
            </mat-card-title>
            <mat-card-content>
                <table>
                    @for (prop of vipProperties; track prop) {
                        <tr>
                            <td>{{ properties[prop].label }}</td>
                            <td>{{ properties[prop].value }}</td>
                        </tr>
                    }
                    @if (!otherPropertiesHidden) {
                        <tr>
                            <td
                                colspan="2"
                                class="fcl-station-properties-horizontal-line-cell"
                            >
                                <hr
                                    class="fcl-station-properties-horizontal-line"
                                />
                            </td>
                        </tr>
                        @for (prop of otherProperties; track prop) {
                            <tr>
                                <td>{{ prop.label }}</td>
                                <td>{{ prop.value }}</td>
                            </tr>
                        }
                    }
                </table>
                @if (otherProperties.length > 0) {
                    <button mat-button (click)="toggleOtherProperties()">
                        @if (otherPropertiesHidden) {
                            <span>More properties</span>
                        }
                        @if (!otherPropertiesHidden) {
                            <span>Less properties</span>
                        }
                    </button>
                }
            </mat-card-content>
        </mat-card>
        <mat-card appearance="outlined">
            <mat-card-content>
                <div
                    #inOutConnector
                    #tooltip="matTooltip"
                    [matTooltip]="tooltipContent"
                ></div>
            </mat-card-content>
        </mat-card>
    </mat-dialog-content>
    <mat-dialog-actions>
        <button mat-button cdkFocusInitial matDialogClose>Close</button>
    </mat-dialog-actions>
</fcl-dialog-movable>
