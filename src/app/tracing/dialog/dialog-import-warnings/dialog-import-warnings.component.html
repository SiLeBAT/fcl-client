<fcl-dialog-movable>
    <!-- this div construct is used here instead of <mat-dialog-content> because of
        some scrollbar issue -->
    <div class="fcl-mat-mdc-dialog-content">
        <mat-card appearance="outlined">
            <mat-card-title>
                <h3>Data import warnings</h3>
            </mat-card-title>
            <mat-card-content>
                @if (description) {
                    <p>{{ description }}</p>
                }
                <ul>
                    @for (warning of warnings; track warning) {
                        <li>{{ warning }}</li>
                    }
                </ul>
            </mat-card-content>
        </mat-card>
    </div>
    <div mat-dialog-actions>
        <button mat-button cdkFocusInitial matDialogClose>Close</button>
    </div>
</fcl-dialog-movable>
