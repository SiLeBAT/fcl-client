<h1 mat-dialog-title>Report View Configuration</h1>
<mat-dialog-content>
    <div>
        <mat-accordion>
            @for (labelInfo of orderedLabelInfos; track labelInfo) {
                <mat-expansion-panel [disabled]="labelInfo.disabled">
                    <mat-expansion-panel-header>
                        <mat-panel-title>
                            <span [matTooltip]="labelInfo.tooltip">{{
                                labelInfo.title
                            }}</span>
                            @if (labelInfo.warning) {
                                <fcl-warning-icon-view
                                    [matTooltip]="labelInfo.warning"
                                />
                            }
                        </mat-panel-title>
                    </mat-expansion-panel-header>
                    <fcl-label-configuration-view
                        class="fcl-label-box"
                        [labelElements]="labelInfo.labelElements"
                        [availableProps]="labelInfo.availableProps"
                        [amountUnitPairs]="labelInfo.amountUnitPairs"
                    ></fcl-label-configuration-view>
                </mat-expansion-panel>
            }
        </mat-accordion>
        <div class="fcl-round-numbers-cb-wrapper">
            <mat-checkbox
                [ngModel]="roundNumbers"
                (ngModelChange)="roundNumbers = $event"
                name="roundNumbersCB"
            >
                Display rounded numbers (three digits)
            </mat-checkbox>
        </div>
    </div>
</mat-dialog-content>
<mat-dialog-actions>
    <button mat-button (click)="onGenerateReport()">Generate Report</button>
    <button mat-button (click)="onRestoreDefaults()">Restore Defaults</button>
    <button mat-button (click)="dialogRef.close()">Cancel</button>
</mat-dialog-actions>
