<h1 matDialogTitle>Report View Configuration</h1>
<form>
    <div mat-dialog-content>
        <mat-accordion>
            <mat-expansion-panel
                *ngFor="let labelInfo of orderedLabelInfos"
                [disabled]="labelInfo.disabled"
            >
                <mat-expansion-panel-header>
                    <mat-panel-title>
                        <span [matTooltip]="labelInfo.tooltip">{{
                            labelInfo.title
                        }}</span>
                        <fcl-warning-icon-view
                            *ngIf="labelInfo.warning"
                            [matTooltip]="labelInfo.warning"
                        />
                    </mat-panel-title>
                </mat-expansion-panel-header>

                <fcl-label-configuration-view
                    class="fcl-label-box"
                    [labelElements]="labelInfo.labelElements"
                    [availableProps]="labelInfo.availableProps"
                    [amountUnitPairs]="labelInfo.amountUnitPairs"
                ></fcl-label-configuration-view>
            </mat-expansion-panel>
        </mat-accordion>
        <div class="fcl-round-numbers-cb-wrapper">
            <mat-checkbox [(ngModel)]="roundNumbers" name="roundNumbersCB">
                Display rounded numbers (three digits)
            </mat-checkbox>
        </div>
    </div>

    <div mat-dialog-actions>
        <button mat-button (click)="onGenerateReport()">Generate Report</button>
        <button mat-button (click)="onRestoreDefaults()">
            Restore Defaults
        </button>
        <button mat-button (click)="dialogRef.close()">Cancel</button>
    </div>
</form>
