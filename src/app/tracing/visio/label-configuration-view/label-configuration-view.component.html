<div class="fcl-box">
    <div class="fcl-box-content">
        @for (
            labelElementRow of labelElements;
            track labelElementRow;
            let rowIndex = $index
        ) {
            <div class="fcl-label-row">
                @for (
                    labelElement of labelElementRow;
                    track labelElement;
                    let elementIndex = $index
                ) {
                    <div class="fcl-label-item">
                        @if (isPropElementInfo(labelElement)) {
                            <fcl-property-element-view
                                [prop]="labelElement.prop"
                                [altText]="labelElement.altText"
                                (propChange)="
                                    onPropElementPropChange(
                                        labelElement,
                                        $event
                                    )
                                "
                                (altTextChange)="
                                    onPropElementAltTextChange(
                                        labelElement,
                                        $event
                                    )
                                "
                                [availableProps]="availableProps"
                                [enableNullProp]="labelElement.isNullable"
                            ></fcl-property-element-view>
                        } @else if (isTextElementInfo(labelElement)) {
                            <fcl-text-element-view
                                [(value)]="labelElement.text"
                                matTooltip="Enter label text"
                            ></fcl-text-element-view>
                        }
                    </div>
                }
            </div>
        }
    </div>
</div>
