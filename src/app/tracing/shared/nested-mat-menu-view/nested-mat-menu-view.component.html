<mat-menu #menu="matMenu" class="fcl-nested-mat-menu" overlapTrigger="false">
    <ng-template matMenuContent let-aliasMenuItems="menuItems">
        @for (
            itemGroup of enforceGroups(aliasMenuItems);
            track itemGroup;
            let i = $index
        ) {
            <span>
                @if (i > 0) {
                    <mat-divider></mat-divider>
                }
                @for (item of itemGroup; track item) {
                    <!-- Handle branch node buttons here -->
                    @if (item.children && item.children.length > 0) {
                        <span>
                            <button
                                mat-menu-item
                                color="primary"
                                data-cy="fcl-graph-menu-item-button"
                                [matMenuTriggerFor]="subMenu.matMenu"
                                [matMenuTriggerData]="{
                                    menuItems: item.children,
                                }"
                                [disabled]="item.disabled"
                                [matTooltip]="item.toolTip"
                                matTooltipPosition="right"
                                matTooltipShowDelay="1500"
                            >
                                {{ item.displayName }}
                            </button>
                            <fcl-nested-mat-menu-view
                                #subMenu
                                (actionSelected)="forwardAction($event)"
                            ></fcl-nested-mat-menu-view>
                        </span>
                    }
                    <!-- Leaf node buttons here -->
                    @if (!item.children || item.children.length === 0) {
                        <span>
                            <button
                                mat-menu-item
                                color="primary"
                                data-cy="fcl-graph-menu-item-button"
                                (click)="itemSelected(item)"
                                [disabled]="item.disabled"
                                [matTooltip]="item.toolTip"
                                matTooltipPosition="right"
                                matTooltipShowDelay="500"
                            >
                                {{ item.displayName }}
                            </button>
                        </span>
                    }
                }
            </span>
        }
    </ng-template>
</mat-menu>
