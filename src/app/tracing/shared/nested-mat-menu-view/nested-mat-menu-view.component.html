<mat-menu #menu="matMenu">
    <ng-template matMenuContent let-aliasMenuItems="menuItems">
        <span
            *ngFor="
                let itemGroup of enforceGroups(aliasMenuItems);
                let i = index
            "
        >
            <mat-divider *ngIf="i > 0"></mat-divider>

            <ng-container *ngFor="let item of itemGroup">
                <!-- Handle branch node buttons here -->
                <span *ngIf="item.children && item.children.length > 0">
                    <button
                        mat-menu-item
                        color="primary"
                        data-cy="fcl-graph-menu-item-button"
                        [matMenuTriggerFor]="subMenu.matMenu"
                        [matMenuTriggerData]="{ menuItems: item.children }"
                        [disabled]="item.disabled"
                        [matTooltip]="item.toolTip"
                        matTooltipPosition="right"
                        matTooltipShowDelay="1500"
                    >
                        {{ item.displayName }}
                    </button>
                    <fcl-nested-mat-menu-view
                        #subMenu
                        (actionSelected)="forwardAction($event)"
                    ></fcl-nested-mat-menu-view>
                </span>
                <!-- Leaf node buttons here -->
                <span *ngIf="!item.children || item.children.length === 0">
                    <button
                        mat-menu-item
                        color="primary"
                        data-cy="fcl-graph-menu-item-button"
                        (click)="itemSelected(item)"
                        [disabled]="item.disabled"
                        [matTooltip]="item.toolTip"
                        matTooltipPosition="right"
                        matTooltipShowDelay="500"
                    >
                        {{ item.displayName }}
                    </button>
                </span>
            </ng-container>
        </span>
    </ng-template>
</mat-menu>
