@if (legend.length > 0 || showMissingGisInfoEntry) {
    <mat-card appearance="outlined" class="fcl-legend">
        <mat-card-content>
            <table>
                @for (item of legend; track item.name) {
                    <tr>
                        <td data-cy="fcl-graph-legend-rule-name">
                            {{ item.name }}
                        </td>
                        @if (showStationColumn) {
                            <td data-cy="fcl-graph-legend-rule-node-symbol">
                                @if (item.shape || item.stationColor) {
                                    <fcl-node-symbol-view
                                        [shapeType]="item.shape"
                                        [fillColor]="item.stationColor"
                                    ></fcl-node-symbol-view>
                                }
                            </td>
                        }
                        @if (showDeliveryColumn) {
                            <td data-cy="fcl-graph-legend-rule-edge-symbol">
                                @if (item.deliveryColor) {
                                    <fcl-edge-symbol-view
                                        [edgeColor]="item.deliveryColor"
                                    ></fcl-edge-symbol-view>
                                }
                            </td>
                        }
                    </tr>
                }
                @if (showMissingGisInfoEntry) {
                    <tr>
                        <td>Missing GIS information</td>
                        <td
                            [attr.colspan]="
                                showStationColumn && showDeliveryColumn ? 2 : 1
                            "
                        >
                            <svg viewBox="0 0 200 200" height="20" width="20">
                                <svg:rect
                                    x="0"
                                    y="50"
                                    rx="20"
                                    ry="20"
                                    width="200"
                                    height="100"
                                    stroke="none"
                                    fill="rgba(255, 0, 0, 0.3)"
                                />
                            </svg>
                        </td>
                    </tr>
                }
            </table>
        </mat-card-content>
    </mat-card>
}
