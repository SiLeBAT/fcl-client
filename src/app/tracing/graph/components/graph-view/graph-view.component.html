<div class="fcl-graph" #graph></div>

@if (showZoom) {
    <!--
    the class fcl-ignore-for-image-export 
    is required to exclude the zoom
    controls from the `Save Image` action
    -->
    <fcl-zoom-view
        class="fcl-graph-zoom fcl-ignore-for-image-export"
        (zoomIn)="onZoomIn()"
        (zoomOut)="onZoomOut()"
        (zoomReset)="onZoomFit()"
    >
    </fcl-zoom-view>
}

<fcl-created-image-view></fcl-created-image-view>
