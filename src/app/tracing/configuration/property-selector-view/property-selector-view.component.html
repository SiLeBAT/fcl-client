<mat-form-field
    class="fcl-complex-filter-form-field"
    subscriptSizing="dynamic"
    appearance="outline"
    color="primary"
>
    @if (label !== null) {
        <mat-label>{{ label }}</mat-label>
    }
    <mat-select
        [ngClass]="isPropDataUnavailable ? 'fcl-option-unsupported' : ''"
        matTooltip="{{ isPropDataUnavailable ? 'Data is not available.' : '' }}"
        panelWidth=""
        [value]="value"
        (valueChange)="onValueChange($event)"
        [disabled]="disabled"
        [placeholder]="placeholder ?? 'property'"
    >
        @for (property of favouriteProperties; track property) {
            <mat-option
                class="fcl-filter-select-option"
                [ngClass]="
                    property.dataIsUnavailable ? 'fcl-option-unsupported' : ''
                "
                matTooltip="{{
                    property.dataIsUnavailable ? 'Data is not available.' : ''
                }}"
                [value]="property.id"
            >
                {{ property.name }}
            </mat-option>
        }
        <mat-option disabled>
            <hr />
        </mat-option>
        @for (property of otherProperties; track property) {
            <mat-option
                class="fcl-filter-select-option"
                [ngClass]="
                    property.dataIsUnavailable ? 'fcl-option-unsupported' : ''
                "
                matTooltip="{{
                    property.dataIsUnavailable ? 'Data is not available.' : ''
                }}"
                [value]="property.id"
            >
                {{ property.name }}
            </mat-option>
        }
        @if (isPropNotListed) {
            <mat-option
                class="fcl-filter-select-option fcl-option-unsupported"
                matTooltip="Data is not available."
                [value]="value"
            >
                {{ value }}
            </mat-option>
        }
    </mat-select>
</mat-form-field>
