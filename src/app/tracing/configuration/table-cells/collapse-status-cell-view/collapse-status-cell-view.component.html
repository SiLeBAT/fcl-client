@if (status === "expanded") {
    <span
        class="datatable-icon-down fcl-pointable fcl-tree-action-icon"
        (click)="onToggleStatus()"
    ></span>
}
@if (status === "collapsed") {
    <span
        class="datatable-icon-right fcl-pointable fcl-tree-action-icon"
        (click)="onToggleStatus()"
    ></span>
}
