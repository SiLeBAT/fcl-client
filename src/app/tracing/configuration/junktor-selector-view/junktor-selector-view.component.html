<mat-form-field
    class="fcl-complex-filter-form-field"
    appearance="outline"
    color="primary"
>
    <mat-select
        [value]="value"
        (valueChange)="onValueChange($event)"
        [disabled]="disabled"
    >
        @for (junktor of availableJunktors; track junktor) {
            <mat-option class="fcl-filter-select-option" [value]="junktor">
                {{ junktorLabel[junktor] }}
            </mat-option>
        }
    </mat-select>
</mat-form-field>
