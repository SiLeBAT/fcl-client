<fcl-filter-elements-view
    class="fcl-filter-elements-view"
    standardFilterLabel="Filter in all delivery data"
    [inputData]="filterElementsViewInputData"
    [activityState$]="activityState$"
    [cycleStart$]="cycleStart$"
    (filterSettingsChange)="onFilterSettingsChange($event)"
    (rowSelectionChange)="onRowSelectionChange($event)"
    (clearAllFilters)="onClearAllFilters()"
    (selectTableColumns)="onSelectTableColumns()"
    (mouseOverTableRow)="onMouseOverTableRow($event)"
    (mouseLeaveTableRow)="onMouseLeaveTableRow($event)"
    (tableRowDblClick)="onTableRowDblClick($event)"
    (tableRowContextMenu)="onTableRowContextMenu($event)"
    [tableRowWithOpenContextMenu]="tableRowWithOpenContextMenu"
></fcl-filter-elements-view>
<fcl-context-menu-view
    (itemSelected)="onTableRowContextMenuSelect($event)"
    #contextMenu
></fcl-context-menu-view>
