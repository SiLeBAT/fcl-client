<mat-form-field
    class="fcl-new-highlighting-rule-form-field"
    subscriptSizing="dynamic"
    appearance="outline"
    color="primary"
>
    <mat-select
        [disabled]="disabled"
        [value]="value"
        (valueChange)="onValueChange($event)"
        placeholder="Shape"
    >
        @for (type of availableShapeTypes; track type) {
            <mat-option class="fcl-filter-select-option" [value]="type">
                {{ getShapeLabel(type) }}
            </mat-option>
        }
    </mat-select>
</mat-form-field>
