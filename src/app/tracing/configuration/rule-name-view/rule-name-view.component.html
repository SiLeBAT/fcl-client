<mat-form-field
    class="fcl-complex-filter-form-field"
    subscriptSizing="dynamic"
    appearance="outline"
    color="primary"
>
    <mat-label>Enter a name</mat-label>
    <input
        matInput
        [ngModel]="ruleName"
        (ngModelChange)="onRuleNameChange($event)"
    />
</mat-form-field>
