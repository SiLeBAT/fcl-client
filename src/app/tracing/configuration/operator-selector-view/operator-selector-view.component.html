<mat-form-field
    class="fcl-complex-filter-form-field"
    appearance="outline"
    color="primary"
>
    <mat-select
        [value]="value"
        (valueChange)="onValueChange($event)"
        [disabled]="disabled"
        panelWidth=""
        placeholder="op"
    >
        @for (operator of availableOperators; track operator) {
            <mat-option
                class="fcl-filter-select-option"
                [value]="operator.type"
                [matTooltip]="operator.tooltip"
                matTooltipPosition="left"
            >
                {{ operator.label }}
            </mat-option>
        }
    </mat-select>
</mat-form-field>
