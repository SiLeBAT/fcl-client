@if (adminTokenValid) {
    <div class="fcl-mat-card-content">
        <div class="fcl-adminactivate-text">
            <p class="mat-body-1">
                You have activated the {{ appName }} account for {{ name }}.
            </p>
        </div>
    </div>
} @else {
    <div class="fcl-mat-card-content">
        <div class="fcl-adminactivate-text">
            <p class="mat-body-1">Your admin activation failed.</p>
            <p class="mat-body-1">Please let the user register again.</p>
        </div>
    </div>
}
