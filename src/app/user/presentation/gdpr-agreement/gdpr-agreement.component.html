<form [formGroup]="gdprAgreementForm">
    <h1 mat-dialog-title>The Data Protection Declaration has been changed.</h1>

    <mat-dialog-content>
        <mat-checkbox required formControlName="dataProtection">
            I have read and accept the
            <a
                class="fcl-policy-link"
                target="_blank"
                [routerLink]="['/content/dataprotectiondeclaration']"
            >
                Privacy Policy
            </a>
            *
        </mat-checkbox>
        <br />
        @if (!validateField("dataProtection")) {
            <mat-error class="fcl-mat-error">
                You must accept the Privacy Policy or logout
            </mat-error>
        }
    </mat-dialog-content>

    <mat-dialog-actions align="end">
        <button mat-raised-button (click)="closeDialog()">Logout</button>
        <button
            mat-raised-button
            color="primary"
            (click)="closeDialog()"
            [disabled]="!gdprAgreementForm.valid"
        >
            Continue
        </button>
    </mat-dialog-actions>
</form>
