<div class="fcl-mat-card-content" *ngIf="tokenValid">
    <div class="fcl-activate-text">
        <p class="mat-subheading-1">
            Your {{ appName }} account is now active and you are able to log in.
        </p>
        <p class="mat-subheading-1">
            For guidance on using the software, please refer to our
            <a href="/assets/quick_guide.pdf" target="_blank">Quick Guide</a> to
            get started easily.
        </p>
    </div>
</div>

<div class="fcl-mat-card-content" *ngIf="!tokenValid">
    <div class="fcl-activate-text">
        <p class="mat-subheading-1">Your account activation failed.</p>
        <p class="mat-subheading-1">
            Please login. In the case of a failure you will receive further
            instructions.
        </p>
    </div>

    <div class="fcl-card-action fcl-card-action-container">
        <div class="form-group fcl-recover-button">
            <button
                mat-raised-button
                color="primary"
                type="submit"
                [routerLink]="['/users/login']"
            >
                Continue to login
            </button>
        </div>
    </div>
</div>
