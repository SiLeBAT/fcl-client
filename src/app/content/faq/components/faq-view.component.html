<div #scrollPanel class="fcl-scroll-panel">
    <div class="fcl-title mat-headline-5">Frequently Asked Questions</div>

    <div><hr /></div>

    <!-- Faq navigation bar-->
    <nav class="fcl-toc">
        @for (section of faq.sections; track section) {
            <a
                class="fcl-toc-link mat-h4"
                [routerLink]="['.']"
                [fragment]="section.urlFragment"
                >{{ section.title }}</a
            >
        }
    </nav>

    <div class="fcl-sections">
        <section>
            <fcl-faq-section-view
                [entries]="faq.topEntries"
            ></fcl-faq-section-view>
        </section>

        @for (section of faq.sections; track section) {
            <section #faqSection [id]="section.urlFragment">
                <fcl-faq-section-view
                    [entries]="section.entries"
                    [title]="section.title"
                ></fcl-faq-section-view>
            </section>
        }
    </div>
</div>
