<mat-accordion multi="true">
    @if (title) {
        <h3 class="fcl-title mat-h3">{{ title }}</h3>
    }
    @for (entry of entries; track entry) {
        <mat-expansion-panel>
            <mat-expansion-panel-header
                collapsedHeight="auto"
                expandedHeight="auto"
            >
                <mat-panel-title>
                    <div
                        class="fcl-panel-title"
                        [innerHtml]="sanitize(entry.question)"
                    ></div>
                </mat-panel-title>
            </mat-expansion-panel-header>
            <ng-template matExpansionPanelContent>
                <div
                    class="fcl-panel-text"
                    [innerHtml]="sanitize(entry.answer)"
                ></div>
            </ng-template>
        </mat-expansion-panel>
    }
</mat-accordion>
